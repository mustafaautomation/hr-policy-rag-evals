[project]
name = "hr-policy-rag-evals"
version = "0.1.0"
description = "Synthetic HR handbook RAG assistant with an offline RAGAS evaluation gate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Muhammad Mustafa" }]
keywords = ["rag", "ragas", "llm-evaluation", "hr-tech"]
dependencies = [
    "faiss-cpu>=1.9.0",
    "numpy>=2.1",
    "openai>=1.55",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.2",
    "ragas==0.4.3",
    # ragas 0.4.3 imports ChatVertexAI from langchain_community.chat_models.vertexai,
    # which later langchain-community releases removed.
    "langchain-community>=0.3.14,<0.4",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
hr-rag = "hr_policy_rag.cli:main"

[project.urls]
Homepage = "https://github.com/mustafaautomation/hr-policy-rag-evals"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hr_policy_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hr_policy_rag"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["hr_policy_rag"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
