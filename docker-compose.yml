services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cedarline
      POSTGRES_PASSWORD: cedarline
      POSTGRES_DB: handbook
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cedarline -d handbook"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
